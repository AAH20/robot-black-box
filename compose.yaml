services:
  evidence-demo:
    build:
      context: .
    command:
      - sh
      - -c
      - npm run conformance && npm run demo && npm run verify:portable
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - rbb-runtime:/opt/robot-black-box/.rbb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rbb-runtime:
