name: Robot Black Box monorepo
on:
  pull_request:
    paths: ['packages/**', 'scripts/**', 'docs/**', 'examples/**', 'package.json', 'package-lock.json', '.github/workflows/robot-black-box-monorepo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monorepo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - run: npm run build:core
      - run: npm run build
      - run: npm test
      - run: npm run demo
      - run: npm run verify:portable
      - run: npm run review
